  <ellipse cx="118" cy="82" rx="6" ry="8" fill="#3a2430"/>
  <circle cx="90" cy="85" r="2" fill="#fff"/>
  <circle cx="120" cy="79" r="2" fill="#fff"/>
  <path d="M92 104 Q104 118 120 100" fill="#7a2a45" stroke="#3a2430" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
