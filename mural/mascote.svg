    <path d="M196 20 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#9ad3f5"/>
    <path d="M14 120 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z" fill="#a8e0b8"/>
