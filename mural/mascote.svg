<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" role="img" aria-label="Mascote do Mural: megafone sorridente">
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c8"/>
      <stop offset="1" stop-color="#f17fa0"/>
    </linearGradient>
    <linearGradient id="boca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd3df"/>
      <stop offset="1" stop-color="#fff2f6"/>
