<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Secretária · Agenda Coordenação</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#77503f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Secretária">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
:root{
  --fg:#000000; --g1:#414142; --g2:#5b5b60; --g3:#aea9b4;
  --rosa:#ff5cb8; --rosa-claro:#ffe3f3; --rosa-bg:#fff5fb; --neon:#ff1fb4; --pink:#ff3ea5;
  --grad:linear-gradient(135deg,#ff6fc0 0%,#ffa3d6 45%,#c9a6ff 100%);
  --font:"Questrial","Helvetica Neue",Arial,sans-serif;
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--fg);background:#fff;font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,textarea{font-family:var(--font);font-size:15px;color:var(--fg)}
button{cursor:pointer;border:0;background:none;padding:0}
.laco{width:34px;height:26px;display:inline-block;filter:drop-shadow(0 2px 4px rgba(255,62,165,.35))}
.digitando{align-self:flex-start;display:inline-flex;gap:4px;padding:12px 14px;margin:2px 0 6px 2px;background:#fff;border-radius:16px;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06);width:max-content}
.digitando span{width:7px;height:7px;border-radius:50%;background:#aea9b4;animation:dig 1.2s infinite ease-in-out}
.digitando span:nth-child(2){animation-delay:.15s}.digitando span:nth-child(3){animation-delay:.3s}
@keyframes dig{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g2)}

/* estrutura */
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header{padding:calc(var(--topo) + 10px) 16px 0;background:#fff;border-bottom:1px solid #f6e2ee}
.cab{display:flex;align-items:center;gap:10px}
.cab .nome{display:grid;line-height:1.15}
.cab .nome b{font-weight:400;font-size:18px;letter-spacing:.03em}
.cab .nome span{font-size:11px;color:var(--g2);letter-spacing:.04em}
.cab .nome span.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rosa);margin-right:6px;vertical-align:1px}
.abas{display:flex;gap:22px;margin-top:10px}
.sino{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;border:1px solid #f2d3e6;border-radius:999px;padding:8px 12px;background:#fff;color:var(--g1)}
.sino svg{width:15px;height:15px;color:var(--pink)}
.abas button{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--g3);padding:9px 0 10px;border-bottom:2px solid transparent}
.abas button.on{color:var(--fg);border-color:var(--pink)}

main{position:relative;overflow:hidden}
#conversa{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 8px;
  background:#fffafd;background-image:radial-gradient(600px 300px at 100% 0,#ffeaf6 0,rgba(255,234,246,0) 70%),radial-gradient(500px 300px at 0 100%,#f6efff 0,rgba(246,239,255,0) 70%)}
#agenda{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
.ver-agenda #agenda{visibility:visible}
.ver-agenda #conversa{visibility:hidden}
.ver-agenda footer{display:none}

.dia-sep{text-align:center;margin:10px 0}
.dia-sep span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--g2);background:#fff;border:1px solid #f4dcea;border-radius:999px;padding:4px 10px}
.msg{display:flex;margin:6px 0}
.msg.eu{justify-content:flex-end}
.bal{max-width:84%;padding:9px 12px 7px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word;position:relative;box-shadow:0 1px 1px rgba(65,65,66,.06)}
.msg.eu .bal{background:var(--rosa-claro);border-top-right-radius:4px}
.msg.ela .bal{background:#fff;border:1px solid #f4dcea;border-top-left-radius:4px}
.bal .hora{display:block;text-align:right;font-size:10px;color:var(--g3);margin-top:3px;letter-spacing:.04em}
.bal .audio{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:2px}
.card{border:1px solid #f4dcea;border-radius:12px;padding:9px 10px;margin-top:8px;background:#fff;white-space:normal}
.card .t{font-size:14px;line-height:1.35}
.card .q{font-size:12px;color:var(--g2);margin-top:2px}
.card .q b{font-weight:400;color:var(--pink)}
.card .bts{display:flex;gap:6px;margin-top:8px}
.card .bts button{font-size:9px;letter-spacing:.16em;text-transform:uppercase;border:1px solid #f2d3e6;border-radius:999px;padding:6px 10px;color:var(--g1);background:#fff}
.card.desfeito{opacity:.45}
.card.desfeito .bts{display:none}
.pill{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;padding:2px 7px;margin-left:4px;vertical-align:1px}
.pill.atrasada{background:var(--neon);color:#fff;animation:neon 1.1s ease-in-out infinite}
.pill.hoje{background:var(--pink);color:#fff}
@keyframes neon{0%,100%{box-shadow:0 0 0 0 rgba(255,31,180,.55)}50%{box-shadow:0 0 0 5px rgba(255,31,180,0)}}

/* barra de escrever */
footer{background:#fff;border-top:1px solid #f6e2ee;padding:8px 10px calc(var(--base) + 8px)}
.barra{display:flex;align-items:flex-end;gap:8px}
.campo{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--rosa-bg);border:1px solid #f7d3e9;border-radius:22px;padding:4px 6px 4px 14px;min-height:44px}
.campo textarea{flex:1;border:0;background:transparent;resize:none;outline:none;line-height:1.4;padding:9px 0;max-height:130px;min-height:22px}
.redondo{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -8px rgba(255,62,165,.6)}
.redondo svg{width:22px;height:22px}
.gravando .campo{display:none}
.rec{flex:1;min-width:0;display:none;align-items:center;gap:10px;min-height:44px;border-radius:22px;border:1px solid var(--rosa);padding:0 8px 0 14px;background:#fff}
.gravando .rec{display:flex}
.rec .ponto{width:10px;height:10px;border-radius:50%;background:var(--neon);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.rec .x{min-width:40px;min-height:40px;flex:none}
.rec .ouvido{flex:1;min-width:0;font-size:13px;color:var(--g1);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl;text-align:left}
.rec .tempo{flex:none;font-size:12px;color:var(--g2);font-variant-numeric:tabular-nums}
.rec .x{font-size:20px;color:var(--g2);padding:0 6px}
.gravando .redondo{background:var(--pink);animation:neon 1.1s ease-in-out infinite}
.dica-teclado{font-size:11px;color:var(--g2);text-align:center;margin:6px 0 0;line-height:1.4}

.campo .clipe{width:34px;height:36px;display:grid;place-items:center;color:var(--g2);flex:none;margin-left:-8px}
.campo .clipe svg{width:22px;height:22px}
.pend{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.pend:empty{display:none}
.pend .p{position:relative;flex:none;width:64px;height:64px;border-radius:12px;border:1px solid #f4dcea;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2)}
.pend .p img{width:100%;height:100%;object-fit:cover}
.pend .p button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:20px}
.anx-msg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.anx-msg button{border:1px solid #f2d3e6;border-radius:10px;background:#fff;overflow:hidden;display:flex;align-items:center;gap:6px;padding:0;max-width:100%}
.anx-msg button img{width:96px;height:96px;object-fit:cover;display:block}
.anx-msg button span{font-size:12px;padding:8px 10px;color:var(--g1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ops{display:grid;gap:6px;margin-top:8px;white-space:normal}
.ops button{text-align:left;border:1px solid #f2d3e6;border-radius:12px;padding:9px 11px;background:#fff;font-size:13px;line-height:1.35;color:var(--fg)}
.ops button small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-bottom:2px}
.ops .prev{font-size:12px;color:var(--g2);margin:2px 2px 0;line-height:1.45}
.ops .feito{font-size:12px;color:var(--g2)}
.ver{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:calc(var(--topo) + 40px) 10px calc(var(--base) + 20px)}
.ver img{max-width:100%;max-height:100%;object-fit:contain}
.ver button{position:absolute;top:calc(var(--topo) + 10px);right:14px;color:#fff;font-size:28px}

/* entrar */
.entrar{position:fixed;inset:0;z-index:20;background:#fff;display:grid;place-items:center;padding:24px;
  background-image:radial-gradient(600px 300px at 100% 0,#ffeaf6 0,rgba(255,234,246,0) 70%),radial-gradient(500px 300px at 0 100%,#f6efff 0,rgba(246,239,255,0) 70%)}
.entrar form{width:min(360px,100%);display:grid;gap:14px;text-align:center}
.entrar .laco{width:64px;height:48px;margin:0 auto}
.entrar h1{font-weight:400;font-size:24px;letter-spacing:.04em;margin:4px 0 0}
.entrar p{margin:0;color:var(--g2);font-size:13px;line-height:1.5}
.entrar input{border:1px solid #efdbe8;border-radius:14px;padding:13px 14px;width:100%;background:#fff;text-align:left}
.entrar input:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 3px var(--rosa-claro)}
.btn{border-radius:999px;padding:14px 20px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(255,62,165,.55)}
.btn:disabled{opacity:.5}
.erro{color:#c2187a;font-size:13px;min-height:18px}
.instalar{font-size:12px;color:var(--g2);line-height:1.5;border-top:1px solid #f4dcea;padding-top:14px;margin-top:4px}
.aviso{position:fixed;left:50%;bottom:calc(var(--base) + 86px);transform:translateX(-50%);background:#000;color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:30;max-width:90vw;text-align:center}
</style>
<style>
/* Visual Head · Rosa & Chocolate (laço da Kah) */
:root{--rosa:#b75675;--rosa-claro:#e0bcbc;--rosa-bg:#f6ecec;--pink:#b75675;--grad:#b75675;--fg:#1d1410;--g1:#4a3a33;--g2:#7a6a63;--g3:#b9a9a4}
body{background:#f8f8f8}
header{background:#77503f;border-bottom:0;color:#fff}
.cab .nome b{color:#fff}
.cab .nome span{color:#e0bcbc}
.cab .nome span.on::before{background:#ff8fb4}
img.laco-img{width:auto;height:46px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.entrar img.laco-img{height:120px;margin:0 auto;filter:drop-shadow(0 14px 20px rgba(75,41,13,.3))}
.sino{background:transparent;border-color:rgba(224,188,188,.5);color:#f6ecec}
.sino svg{color:#e0bcbc}
.abas button{color:#cdb9b2}
.abas button.on{color:#fff;border-color:#e0bcbc}
#conversa{background:#f8f8f8;background-image:none}
.dia-sep span{border-color:#efe2e2;color:#7a6a63}
.msg.eu .bal{background:#e0bcbc;color:#2b1a10}
.msg.ela .bal{border-color:#efe2e2}
.card{border-color:#efe2e2}
.card .bts button,.ops button,.anx-msg button{border-color:#efe2e2}
.pill.hoje{background:#e0bcbc;color:#4b290d}
footer{border-top-color:#efe2e2}
.campo{background:#fff;border-color:#efe2e2}
.redondo{background:#b75675;box-shadow:0 8px 18px -8px rgba(183,86,117,.7)}
.gravando .redondo{background:#4b290d}
.rec{border-color:#e0bcbc}
.entrar{background:#f8f8f8;background-image:none}
.entrar input{border-color:#efe2e2}
.entrar input:focus{border-color:#e0bcbc;box-shadow:0 0 0 3px #f6ecec}
.btn{background:#b75675;box-shadow:0 10px 22px -12px rgba(183,86,117,.8)}
.instalar{border-top-color:#efe2e2}
.digitando{border:1px solid #efe2e2}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="cab">
      <img class="laco laco-img" src="" data-laco="1" alt="">
      <div class="nome"><b>Minha secretária</b><span id="estado">conectando…</span></div>
      <button type="button" class="sino" id="sino" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Ativar avisos</button>
    </div>
    <nav class="abas"><button type="button" class="on" data-aba="conversa">Conversa</button><button type="button" data-aba="agenda">Agenda</button></nav>
  </header>
  <main>
    <div id="conversa" aria-live="polite"></div>
    <iframe id="agenda" title="Agenda Coordenação"></iframe>
  </main>
  <footer id="rodape">
    <div class="pend" id="pend"></div>
    <input type="file" id="arquivo" multiple accept="image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.ods,.csv,.txt" hidden>
    <div class="barra">
      <div class="campo"><button type="button" class="clipe" id="clipe" aria-label="Anexar foto ou documento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5 12 20a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6L15 6.7"/></svg></button><textarea id="txt" rows="1" placeholder="Mensagem" enterkeyhint="send"></textarea></div>
      <div class="rec"><span class="ponto"></span><span class="ouvido" id="ouvido">Ouvindo…</span><span class="tempo" id="tempo">0:00</span><button type="button" class="x" id="cancelar" aria-label="Cancelar áudio">×</button></div>
      <button type="button" class="redondo" id="acao" aria-label="Gravar áudio"></button>
    </div>
    <p class="dica-teclado" id="dicaTeclado" hidden>Neste celular, use o microfone do teclado para ditar.</p>
  </footer>
</div>

<div class="ver" id="ver" hidden><button type="button" id="verFechar" aria-label="Fechar">×</button><img id="verImg" alt=""></div>

<div class="entrar" id="entrar" hidden>
  <form id="fEntrar" autocomplete="on">
    <img class="laco laco-img" src="" data-laco="1" alt="">
    <div class="k">Agenda Coordenação</div>
    <h1>Secretária</h1>
    <p>Entre com o mesmo login e senha do Saint Center. Este celular fica conectado por 90 dias.</p>
    <input id="eLogin" name="username" autocomplete="username" placeholder="Login ou e-mail" autocapitalize="none" required>
    <input id="eSenha" name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
    <div class="erro" id="eErro"></div>
    <button class="btn" id="eBtn">Entrar</button>
    <div class="instalar" id="dicaInstalar"></div>
  </form>
</div>

<script src="../agenda/lacos.js?v=1"></script>
<script>document.querySelectorAll('img[data-laco]').forEach(i => i.src = window.SG_LACO || '../agenda/laco.png');</script>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbyWR9ceeCuNbgk_yjyzn-8mCQwCgpSVpFrn3gvsS2HGniMxP14pNNmVIRXLGqP8_F3g/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
let DIGITANDO = 0;
const K_COD = 'sg-agenda-app-codigo', K_USU = 'sg-agenda-app-usuario', K_CHAT = 'sg-agenda-app-conversa';
const IC_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
const IC_ENV = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>';

function aviso(t){ const a = document.createElement('div'); a.className = 'aviso'; a.textContent = t; document.body.appendChild(a); setTimeout(() => a.remove(), 3200); }
function usuario(){ try{ return JSON.parse(localStorage.getItem(K_USU) || 'null'); }catch(_){ return null; } }
const primeiroNome = () => { const n = String((usuario() || {}).nome || '').trim().split(/\s+/)[0] || ''; return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : ''; };

/* ---------- entrar ---------- */
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
$('dicaInstalar').innerHTML = standalone ? '' : (ios
  ? 'Para virar aplicativo: no Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.'
  : 'Para virar aplicativo: no Chrome, toque no menu <b>⋮</b> e depois em <b>Instalar app</b> (ou Adicionar à tela inicial).');
$('fEntrar').addEventListener('submit', async e => {
  e.preventDefault();
  $('eErro').textContent = ''; $('eBtn').disabled = true; $('eBtn').textContent = 'Entrando…';
  try{
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ fn:'agendaEntrar', args:[$('eLogin').value.trim(), $('eSenha').value] }) });
    const j = await r.json();
    if(!j.ok) throw new Error(/desconhecida/i.test(j.erro || '') ? 'O servidor ainda não foi atualizado para o aplicativo. Fale com a coordenação.' : j.erro);
    localStorage.setItem(K_COD, j.resultado.codigo); guardarCodigoSW(j.resultado.codigo);
    localStorage.setItem(K_USU, JSON.stringify(j.resultado.usuario));
    $('eSenha').value = '';
    $('entrar').hidden = true;
    iniciar();
  }catch(err){ $('eErro').textContent = err.message || 'Não consegui entrar. Confira a internet.'; }
  $('eBtn').disabled = false; $('eBtn').textContent = 'Entrar';
});
function pedirLogin(msg){ $('entrar').hidden = false; $('eErro').textContent = msg || ''; const u = usuario(); if(u && !$('eLogin').value) $('eLogin').value = u.login || ''; }

/* ---------- agenda (a mesma do computador, dentro do aplicativo) ---------- */
let SEC = null, SECA = null, carregada = false;
function agendaWin(){ try{ return $('agenda').contentWindow; }catch(_){ return null; } }
function iniciar(){
  $('estado').textContent = 'conectando…'; $('estado').className = '';
  carregada = false; SEC = null;
  $('agenda').src = '../agenda/?app=1&v=' + VERSAO;
}
$('agenda').addEventListener('load', () => {
  const w = agendaWin(); if(!w || !w.document) return;
  const bloq = w.document.getElementById('bloqueio');
  if(bloq && !bloq.hidden){ $('estado').textContent = 'acesso exclusivo da coordenação'; SEC = null; return; }
  SEC = w.SG_secretaria || null; SECA = w.SG_anexos || null; carregada = !!SEC;
  if(!SEC){ $('estado').textContent = 'não consegui abrir a agenda'; return; }
  $('estado').textContent = 'online'; $('estado').className = 'on';
  w.addEventListener('sg-agenda-sessao', () => pedirLogin('Sua sessão expirou. Entre novamente.'));
  w.addEventListener('sg-agenda-sync', ev => {
    const d = ev.detail || {}, t = norm(d.txt);
    $('estado').className = d.cls === 'erro' ? '' : 'on';
    $('estado').textContent = /sincronizado/.test(t) ? 'online · agenda em dia' : /salvando/.test(t) ? 'online · salvando…' : /so neste/.test(t) ? 'online · só neste celular' : String(d.txt || '').toLowerCase();
  });
  boasVindas();
  const fila = FILA.splice(0); fila.forEach(f => responder(f.texto));

function miniatura(file){
  return new Promise(ok => {
    if(!/^image\//.test(file.type)) return ok('');
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const L = 200, e = Math.min(1, L / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * e); c.height = Math.round(img.height * e); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .7)); };
    img.onerror = () => { URL.revokeObjectURL(url); ok(''); };
    img.src = url;
  });
}
// fotos do iPhone chegam enormes: reduz para leitura e envio rápidos, sem perder a legibilidade
function reduzirFoto(file){
  return new Promise(ok => {
    if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type) || file.size < 900000) return ok(file);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const L = 2000, e = Math.min(1, L / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * e); c.height = Math.round(img.height * e);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => ok(b ? new File([b], (file.name || 'foto').replace(/\.\w+$/, '') + '.jpg', { type:'image/jpeg' }) : file), 'image/jpeg', .85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}
async function adicionarArquivos(lista){

    const f = await reduzirFoto(new File([f0], nome, { type: f0.type }));

}

/* perguntas: hoje, amanhã, semana, atrasadas */
function pergunta(t){
  const n = norm(t).replace(/[?!.]/g, '').trim();
  const ehPerg = /^(o que|oque|que|qual|quais|me (diz|fala|mostra|passa)|mostra|lista|tem algo|tenho algo|como esta|como ta|e )/.test(n) || /\?$/.test(t.trim()) || /^(agenda|compromissos|pendencias|tarefas)\b/.test(n);
  if(!ehPerg) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const am = new Date(hoje); am.setDate(am.getDate() + 1);
  const fim = new Date(hoje); fim.setDate(fim.getDate() + 7);
  const its = SEC.itens().filter(i => !i.feito);
  const ord = (a, b) => (a.data + (a.hora || '99')).localeCompare(b.data + (b.hora || '99'));
  if(/atrasad|venceu|vencid|pendente|em aberto/.test(n)){
    const l = its.filter(i => SEC.status(i) === 'atrasada' && !SEC.ehReuniao(i) && !['compromisso','objetivo'].includes(i.tipo)).sort(ord);
    return { texto: l.length ? `Você tem ${l.length} ${l.length === 1 ? 'item atrasado' : 'itens atrasados'}:` : 'Nada atrasado. Tudo em dia!', lista:l };
  }
  if(/amanha/.test(n)){ const l = its.filter(i => i.data === iso(am)).sort(ord); return { texto: l.length ? 'Amanhã você tem:' : 'Amanhã está livre por enquanto.', lista:l }; }
  if(/semana|proximos dias/.test(n)){ const l = its.filter(i => i.data && i.data >= iso(hoje) && i.data <= iso(fim)).sort(ord); return { texto: l.length ? 'Nos próximos 7 dias:' : 'Nada marcado nos próximos 7 dias.', lista:l }; }
  if(/hoje|agora|agenda|dia/.test(n)){ const l = its.filter(i => i.data === iso(hoje)).sort(ord); return { texto: l.length ? 'Hoje você tem:' : 'Hoje não tem nada marcado.', lista:l }; }
  return null;
}

let FILA = [];
function receber(texto, audio){
  texto = String(texto || '').trim(); if(!texto) return;
  falar('eu', texto, audio ? { audio:true } : null);
  if(!SEC){ FILA.push({ texto }); if(FILA.length === 1) falar('ela', 'Só um instante, estou abrindo sua agenda…'); return; }
  responder(texto);
}
function mostrarResposta(r){
  falar('ela', r.texto, { cards: (r.cards || []).map(c => Object.assign({}, c)), opc: (r.opcoes || []).map(o => ({ rotulo:o.rotulo, sub:o.sub || '', acao:o.acao })) });
}
function responder(texto){
  if(SEC.conversar){
    digitando(true);
    Promise.resolve().then(() => SEC.conversar(texto))
      .then(r => { digitando(false); mostrarResposta(r); })
      .catch(() => { digitando(false); falar('ela', 'Tive um problema para entender agora. Pode repetir de outro jeito?'); });
    return;
  }
  setTimeout(() => {
    const mb = norm(texto).match(/^(busca|buscar|busque|procura|procurar|procure|pesquisa|pesquisar|pesquise|acha|achar|ache|encontra|encontrar|encontre)\b[:\s]*(.*)$/);
    if(mb && SEC.buscar){
      const q = texto.trim().split(/\s+/).slice(1).join(' ').replace(/^(por|sobre|o|a)\s+/i, '');
      const r = q ? SEC.buscar(q) : [];
      if(!r.length){ falar('ela', q ? 'Não encontrei nada sobre “' + q + '”. Tente outra palavra.' : 'O que eu procuro? Ex.: “buscar orçamento”.'); return; }
      const itens = r.filter(x => x.fonte === 'item').slice(0, 10), ent = r.filter(x => x.fonte === 'entrada').slice(0, 3);
      falar('ela', 'Encontrei ' + r.length + (r.length === 1 ? ' resultado' : ' resultados') + ' para “' + q + '”:' + ent.map(x => '\n\n📥 Caixa de entrada: “' + x.trecho.slice(0, 180) + '”').join(''), { cards: itens.map(x => ({ id:x.id, titulo:x.titulo })) });
      return;
    }
    const p = pergunta(texto);
    if(p){ falar('ela', p.texto, { cards: p.lista.slice(0, 25).map(i => ({ id:i.id, titulo:i.titulo })) }); return; }
    let feitos = [];
    try{ feitos = SEC.anotar(texto); }catch(e){ feitos = []; }
    if(!feitos.length){ falar('ela', 'Não entendi bem. Me diga o que é, o dia e o horário. Ex.: “sexta às 10h alinhamento com o Bruno”.'); return; }
    const semData = feitos.filter(i => !i.data).length;
    const t = (feitos.length === 1 ? 'Anotado na sua agenda.' : `Anotei ${feitos.length} itens na sua agenda.`) + (semData ? `\n${semData === 1 ? 'Ficou sem data' : semData + ' ficaram sem data'}: abra para ajustar se quiser.` : '');
    falar('ela', t, { cards: feitos.map(i => ({ id:i.id, titulo:i.titulo, tipo:i.tipo, data:i.data, hora:i.hora, pessoa:i.pessoa, podeDesfazer:true })) });
  }, 60);
}

  else { aviso('Não captei sua voz. Use o microfone do teclado.'); $('dicaTeclado').hidden = false; txt.focus(); }
}
function gravar(){
  if(!SR){ $('dicaTeclado').hidden = false; txt.focus(); return; }
  final = ''; parcial = ''; encerrado = false;
  const r = new SR(); rec = r; r.lang = 'pt-BR'; r.interimResults = true; r.continuous = true;
  r.onresult = e => {
    if(encerrado || rec !== r) return;
    let f = '', p = '';
    for(let i = 0; i < e.results.length; i++){ const x = e.results[i], tr = String(x[0].transcript || '').trim(); if(!tr) continue; if(x.isFinal){ if(!f.trim().endsWith(tr)) f += tr + ' '; } else p += tr + ' '; }
    final = f; parcial = p.trim();
    $('ouvido').textContent = (final + parcial).trim() || DICA_REC;
    clearTimeout(tSemVoz);
  };
  r.onerror = e => {
    if(encerrado || rec !== r) return;
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ aviso('Libere o microfone e o Ditado do iPhone: Ajustes > Geral > Teclado > Ativar Ditado.'); $('dicaTeclado').hidden = false; encerrar(false); }
    else if(e.error === 'no-speech'){ aviso('Não ouvi nada. Tente de novo.'); encerrar(false); }
    else if(e.error !== 'aborted'){ aviso('Não consegui ouvir agora. Use o microfone do teclado.'); $('dicaTeclado').hidden = false; encerrar(true); }
  };
  r.onend = () => { if(encerrado || rec !== r) return; encerrar(true); };  // o navegador parou sozinho: envia o que ouviu
  try{ r.start(); }catch(_){ rec = null; aviso('Não consegui abrir o microfone. Use o microfone do teclado.'); $('dicaTeclado').hidden = false; txt.focus(); return; }
  gravando = true; document.body.classList.add('gravando'); $('ouvido').textContent = DICA_REC;
  tInicio = Date.now(); $('tempo').textContent = '0:00';
  tRelogio = setInterval(() => { const s = Math.floor((Date.now() - tInicio) / 1000); $('tempo').textContent = Math.floor(s / 60) + ':' + pad(s % 60); }, 500);
  tSemVoz = setTimeout(() => { if(gravando && !(final + parcial).trim()) $('ouvido').textContent = 'Não estou captando… toque na seta ou no ×'; }, 7000);
  botao();
}
$('acao').addEventListener('click', () => {
  if(gravando){ encerrar(true); return; }
  if(temAlgo()) enviarTexto(); else gravar();
});
$('cancelar').addEventListener('click', () => encerrar(false));
botao();


/* ---------- avisos no celular (notificações) ---------- */
const VAPID = 'BK8HANArRiDqmT4YT6r5wRxymIFVCGWpGbJcnNjwDGs_h8YDaHLVyPkbL03o0-CsmpZx9H4QmDjPi6LO6p64gLo';
async function chamar(fn, ...args){
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ fn, args:[localStorage.getItem(K_COD) || ''].concat(args) }) });
  const j = await r.json(); if(!j.ok) throw new Error(j.erro || 'Erro'); return j.resultado;
}
function guardarCodigoSW(cod){
  try{ const r = indexedDB.open('sg-secretaria', 1); r.onupgradeneeded = () => r.result.createObjectStore('cfg'); r.onsuccess = () => { try{ r.result.transaction('cfg', 'readwrite').objectStore('cfg').put(cod, 'codigo'); }catch(_){} }; }catch(_){}
}
const chaveVapid = () => { const b = atob(VAPID.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - VAPID.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const temPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function inscrever(pedir){
  if(!temPush()) return false;
  if(pedir){ const r = await Notification.requestPermission(); if(r !== 'granted') return false; }
  if(Notification.permission !== 'granted') return false;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: chaveVapid() });
  await chamar('agendaPushInscrever', sub.toJSON());
  return true;
}
function prepararSino(){
  const b = $('sino');
  if(!temPush()){ b.hidden = !ios; b.onclick = () => aviso('Para receber avisos, adicione a Secretária à Tela de Início e abra por lá.'); return; }
  if(Notification.permission === 'granted'){ b.hidden = true; inscrever(false).catch(() => {}); return; }
  b.hidden = Notification.permission === 'denied' ? false : false;
  b.onclick = async () => {
    if(Notification.permission === 'denied'){ aviso('Os avisos estão bloqueados. Libere em Ajustes > Notificações > Secretária.'); return; }
    b.disabled = true;
    try{
      if(await inscrever(true)){ b.hidden = true; aviso('Avisos ligados.'); chamar('agendaAvisoTeste').catch(() => {}); }
      else aviso('Os avisos não foram liberados.');
    }catch(e){ aviso('Não consegui ligar os avisos agora. Tente de novo.'); }
    b.disabled = false;
  };
}
// a Secretária também avisa dentro da conversa quando você abre o app
function avisarNaConversa(forcar){
  if(!SEC || !SEC.avisos) return;
  const a = SEC.avisos(); if(!a.texto) return;
  const k = 'sg-agenda-app-ultimo-aviso', hoje = iso(new Date()), marca = hoje + '|' + a.texto;
  if(!forcar && localStorage.getItem(k) === marca) return;
  localStorage.setItem(k, marca);
  const ids = a.atrasadas.concat(a.vencem, a.eventos).slice(0, 8);
  falar('ela', a.texto, { cards: ids.map(id => { const it = SEC.itens().find(i => i.id === id) || { id, titulo:'' }; return { id, titulo: it.titulo }; }) });
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => { if(ev.data && ev.data.aviso){ trocarAba('conversa'); avisarNaConversa(true); } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') setTimeout(() => avisarNaConversa(false), 1500); });

/* ---------- início ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// versão nova publicada: limpa a cópia guardada no celular e abre a nova
const VERSAO = '2026-11-20-1';
async function checarVersao(){
  try{
    const j = await fetch('../versao.json?x=' + Date.now(), { cache:'no-store' }).then(r => r.json());
    if(!j.v || j.v === VERSAO) return;
    const k = 'sg-secretaria-atualizou:' + j.v; if(sessionStorage.getItem(k) || txt.value.trim() || gravando) return;
    sessionStorage.setItem(k, '1');
    try{ const reg = await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(_){}
    try{ const ks = await caches.keys(); await Promise.all(ks.map(x => caches.delete(x))); }catch(_){}
    location.reload();
  }catch(_){}
}
checarVersao();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checarVersao(); });
if(localStorage.getItem(K_COD)){ guardarCodigoSW(localStorage.getItem(K_COD)); iniciar(); } else pedirLogin();
prepararSino();
desenhar();
